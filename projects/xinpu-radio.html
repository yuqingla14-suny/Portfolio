<body>
  <!-- 頁首導覽：返回作品集首頁的專案作品區。 -->

  <!-- 案例內容：上方呈現作品輪播，下方分欄介紹作品資訊與創作內容。 -->
  <main class="article-page project-detail"><article class="container">
    <a class="project-back" href="../index.html#projects">← 專案作品</a>
    <!-- 作品輪播：使用 Bootstrap 輪播呈現此專案的相關照片。 -->
    <div id="carousel-xinpu-radio" class="carousel slide project-carousel" aria-label="新埔廣播作品照片">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="../images/新埔廣播.JPG" alt="新埔廣播專案影像">

      </div>
    </div>

      <aside class="project-detail-meta">
        <span class="section-tag">Selected Project</span>
        <h1>新埔廣播</h1>
        <p class="project-en">Local Stories</p>
        <div class="project-detail-tags" aria-label="作品分類標籤">

          <span>聲音</span>

  <!-- 頁尾：顯示案例頁版權資訊。 -->
  <footer class="article-footer">© 2026 sunny的作品集</footer>
